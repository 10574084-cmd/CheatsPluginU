name: Release CheatsPlugin

on:
  # Publish the initial v0.2.0 release only on the specifically named commit.
  # Manual runs remain available for future version tags.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.3.0"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish CheatsPlugin v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Aroma plugin
        run: |
          docker build -t cheatsplugin-builder .
          docker run --rm -v "$PWD:/project" -w /project cheatsplugin-builder make
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.3.0' }}
        run: |
          gh release create "$TAG" CheatsPlugin.wps \
            --title "CheatsPlugin $TAG" \
            --notes "## CheatsPlugin $TAG

          Aroma plugin for Wii U. Version 0.3.0 adds online Title-ID lookup for compatible direct poke32 cheats. CURLWrapperModule.wms is required for HTTPS requests.

          ### Installation
          Copy CheatsPlugin.wps to sd:/wiiu/environments/aroma/plugins/.

          ### Important
          The plugin searches uCodes by Title ID and only enables compatible direct poke32 entries. Install CURLWrapperModule.wms in Aroma for HTTPS. The build still needs testing on real Wii U hardware; see README.md for limits and setup."
