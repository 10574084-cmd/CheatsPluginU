name: Build CheatsPlugin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'CheatsPlugin.wps'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Aroma plugin
        run: |
          docker build -t cheatsplugin-builder .
          docker run --rm -v "$PWD:/project" -w /project cheatsplugin-builder make
      - name: Publish WPS in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CheatsPlugin.wps
          if git diff --cached --quiet -- CheatsPlugin.wps; then
            echo "CheatsPlugin.wps is already up to date."
            exit 0
          fi
          git commit -m "Build CheatsPlugin.wps"
          git push
      - name: Upload WPS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatsPlugin-wps
          path: CheatsPlugin.wps
          if-no-files-found: error
